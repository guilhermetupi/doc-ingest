[project]
name = "doc-ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guilherme Tupinamba", email = "gtupinamba@pensadoria.com.br" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.3",
    "greenlet>=3.5.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "pypdf2>=3.0.1",
    "sqlalchemy>=2.0.50",
    "structlog>=25.5.0",
]

[project.scripts]
doc-ingest = "doc_ingest:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
